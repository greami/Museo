services:
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    image: museo-user-service:local
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8082/v3/api-docs >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - museo-net

  core-service:
    build:
      context: ./core-service
      dockerfile: Dockerfile
    image: museo-core-service:local
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
    depends_on:
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8084/v3/api-docs >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - museo-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: museo-api-gateway:local
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      USER_SERVICE_URL: http://user-service:8082
      CORE_SERVICE_URL: http://core-service:8084
    depends_on:
      user-service:
        condition: service_healthy
      core-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/v3/api-docs >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - museo-net

  uiapp:
    build:
      context: ./UIApp
      dockerfile: Dockerfile
    image: museo-uiapp:local
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - museo-net

networks:
  museo-net:
    driver: bridge
